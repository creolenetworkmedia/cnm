name: CNM isolated verification
on:
  push:
    branches: [feat/cnm-editorial-launch]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnm-isolated-check
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify existing application baseline
        run: npm run build
      - name: Prepare test tooling
        run: npm install --save-dev --save-exact vitest@4 @testing-library/react@16 @testing-library/jest-dom@6 jsdom@26 @playwright/test@1 @axe-core/playwright@4 --no-audit --no-fund
      - name: Package isolated source and tools
        run: tar -czf cnm-workspace.tgz src public docs node_modules package.json package-lock.json tsconfig.json vite.config.ts index.html
      - uses: actions/upload-artifact@v4
        with:
          name: cnm-workspace
          path: cnm-workspace.tgz
          retention-days: 1
