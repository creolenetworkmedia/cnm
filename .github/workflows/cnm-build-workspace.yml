name: CNM isolated build workspace
on:
  push:
    branches: [feat/cnm-editorial-v2]
    paths: [.github/workflows/cnm-build-workspace.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact test tools before one clean install
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const tools={vitest:'4','@testing-library/react':'16','@testing-library/jest-dom':'6',jsdom:'26','@playwright/test':'1','@axe-core/playwright':'4'};
          for(const [name,major] of Object.entries(tools)){
            const v=JSON.parse(execFileSync('npm',['view',name+'@'+major,'version','--json'],{encoding:'utf8'}));
            p.devDependencies[name]=Array.isArray(v)?v.at(-1):v;
          }
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          console.log(p.devDependencies);
          JS
          npx --yes npm@11.6.0 install --no-fund
      - name: Capture dependency audit
        if: always()
        run: npm audit --json > dependency-audit.json || true
      - name: Export source and dependencies (no credentials)
        if: success()
        run: |
          git archive --format=tar HEAD > source.tar
          tar -czf dependencies.tgz node_modules package.json package-lock.json dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cnm-build-workspace
          path: |
            source.tar
            dependencies.tgz
          retention-days: 1
