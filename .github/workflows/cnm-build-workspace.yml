name: CNM isolated build workspace
on:
  push:
    branches: [feat/cnm-editorial-v2]
    paths: [.github/workflows/cnm-build-workspace.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install inspected baseline
        run: npm install --no-fund
      - name: Verify original application builds
        run: npm run build
      - name: Resolve test tools without changing production versions
        run: npm install --save-dev --save-exact vitest@4 @testing-library/react@16 @testing-library/jest-dom@6 jsdom@26 @playwright/test@1 @axe-core/playwright@4 --no-fund
      - name: Capture dependency audit
        run: npm audit --json > dependency-audit.json || true
      - name: Export source and dependency workspace (no credentials)
        run: |
          git archive --format=tar HEAD > source.tar
          tar -czf dependencies.tgz node_modules package.json package-lock.json dependency-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: cnm-build-workspace
          path: |
            source.tar
            dependencies.tgz
          retention-days: 1
