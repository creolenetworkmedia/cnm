name: CNM custom domain root verification
on:
  push:
    branches: [fix/custom-domain-root-build]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npx --yes npm@11.6.0 ci --no-fund
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:node
      - name: Build for custom domain
        env:
          CNM_DEPLOY_TARGET: domain
        run: npm run build
